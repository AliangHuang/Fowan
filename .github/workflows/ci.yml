name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Architecture and governance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.422
      - name: Prepare Windows App Runtime for WinUI tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkVersion = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.FowanWindowsAppSdkVersion
          if ($sdkVersion -ne '2.2.0') { throw 'Review the pinned CI runtime when changing the Windows App SDK version.' }
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-2.2.0-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/2.2/2.2.0/windowsappruntimeinstall-x64.exe' -OutFile $installer -TimeoutSec 120
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') {
            throw 'The Windows App Runtime installer must have a valid Microsoft signature.'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '--quiet' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows App Runtime installation failed: $($process.ExitCode)" }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command "Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.*' | Select-Object Name, Version, Architecture"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect installed Windows App Runtime packages.' }
      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1
